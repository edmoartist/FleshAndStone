<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clockwork Manor - Single File HTML5 Roguelite</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #08070a;
    color: #f4e9d8;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    background: #09070b;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const TILE = 32;
const ROOM_W = 34;
const ROOM_H = 20;
const ROOM_MARGIN = 4;
const T = { FLOOR: 0, WALL: 1, BREAK: 2, SPIKE: 3, TRAPDOOR: 4, SHOP: 5, DOOR: 6 };
const DIRS = { N:[0,-1], E:[1,0], S:[0,1], W:[-1,0] };
const OPP = { N:'S', S:'N', E:'W', W:'E' };
const TAU = Math.PI * 2;

function fitCanvas() {
  const dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fitCanvas);
fitCanvas();

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(a, b, c, d) { return Math.hypot(a - c, b - d); }
function lerp(a, b, t) { return a + (b - a) * t; }
function normAng(a) { while (a < -Math.PI) a += TAU; while (a > Math.PI) a -= TAU; return a; }
function keyOf(x, y) { return x + ',' + y; }
function wrapText(text, max) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    if ((line + w).length > max) { lines.push(line.trim()); line = ''; }
    line += w + ' ';
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(Date.now());
function rnd() { return rng(); }
function ri(a, b) { return Math.floor(rnd() * (b - a + 1)) + a; }
function chance(p) { return rnd() < p; }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

const keys = Object.create(null);
let justInteract = false;
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') justInteract = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key.toLowerCase() === 'r' && (G.state === 'dead' || G.state === 'win' || G.state === 'title')) startRun();
  if (e.key === 'Enter' && G.state === 'title') startRun();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const mouse = { x: 0, y: 0, down: false };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', () => {
  mouse.down = true;
  if (G.state === 'title') startRun();
});
canvas.addEventListener('mouseup', () => mouse.down = false);

const ITEMS = [
  { name:'Pepper Lens', tag:'piercing heat', desc:'+Damage. Shots pierce once. Piercing + poison is brutal.', apply:p=>{p.damage+=1.3;p.pierce+=1;} },
  { name:'Glass Drizzle', tag:'wide rain', desc:'+2 shots per volley, lower damage. Great with lightning or poison.', apply:p=>{p.shots+=2;p.spread+=0.17;p.damage*=0.82;} },
  { name:'Static Jam', tag:'chain zap', desc:'Hits arc lightning to nearby enemies. Multishot makes storms.', apply:p=>{p.lightning=true;p.damage+=0.35;} },
  { name:'Toxic Glue', tag:'floor venom', desc:'Shots poison and leave puddles on split or death.', apply:p=>{p.poison=true;p.damage+=0.25;} },
  { name:'Forked Candle', tag:'split shots', desc:'Shots split into two smaller shots. Combines with poison and lightning.', apply:p=>{p.split=true;p.fireRate*=0.93;} },
  { name:'Boomerang Thread', tag:'rebounds', desc:'Shots bounce from walls. Homing bounce shots hunt around furniture.', apply:p=>{p.bounce+=2;p.range+=320;} },
  { name:'Tiny Moon', tag:'soft homing', desc:'Shots bend toward targets. Also pulls coins from farther away.', apply:p=>{p.homing=true;p.magnet+=0.4;} },
  { name:'Clockwork Spoon', tag:'faster hands', desc:'Move and shoot faster.', apply:p=>{p.speed+=36;p.fireRate*=0.78;} },
  { name:'Lucky Receipt', tag:'shop abuse', desc:'Cheaper shops and better drops.', apply:p=>{p.discount*=0.7;p.luck+=0.2;} },
  { name:'Magnet Marble', tag:'loot vacuum', desc:'Coins, hearts, and secret pickups drift toward you.', apply:p=>{p.magnet+=1.1;} },
  { name:'Pocket Saw', tag:'orbital blade', desc:'Adds an orbiting saw that shreds nearby enemies and furniture.', apply:p=>{p.orbitals+=1;} },
  { name:'Secret Chalk', tag:'wall whispers', desc:'Secret walls shimmer. Breakable walls crack faster.', apply:p=>{p.secretSense=true;p.breakBonus+=1.2;} },
  { name:'Vampire Button', tag:'red reward', desc:'Occasionally heals when enemies die.', apply:p=>{p.vampire+=0.18;p.maxHp+=1;p.hp=Math.min(p.maxHp,p.hp+1);} },
  { name:'Splinter Dice', tag:'messy crits', desc:'Luck-based critical hits and extra furniture drops.', apply:p=>{p.crit+=0.16;p.luck+=0.12;} },
  { name:'Bomb Seed', tag:'popcorn blast', desc:'Some shots burst on impact. Forked bounces become chaos.', apply:p=>{p.bombShot+=0.24;} },
  { name:'Ink Sneakers', tag:'trap dancer', desc:'Speed up and take half damage from spikes.', apply:p=>{p.speed+=54;p.spikeResist=true;} },
  { name:'Cardboard Crown', tag:'greedy power', desc:'Every 10 coins grants damage. Discounts stack hard.', apply:p=>{p.coinPower=true;p.discount*=0.86;} },
  { name:'Lantern Belly', tag:'more life', desc:'+2 max hearts and a warm manor glow.', apply:p=>{p.maxHp+=2;p.hp+=2;p.glow+=80;} }
];

const G = {
  state: 'title',
  floor: 1,
  seedText: '',
  level: null,
  player: null,
  bullets: [], ebullets: [], enemies: [], props: [], items: [], drops: [], particles: [], hazards: [], traps: [], texts: [],
  merchant: null,
  cam: { x: 0, y: 0 },
  now: 0,
  shake: 0,
  message: '',
  messageT: 0,
  currentRoom: -1
};

function makePlayer(x, y) {
  return {
    x, y, r: 12, hp: 6, maxHp: 6, coins: 0,
    speed: 166, damage: 3.1, shotSpeed: 470, fireRate: 260, range: 720,
    shots: 1, spread: 0.09, pierce: 0, bounce: 0,
    poison: false, lightning: false, split: false, homing: false,
    magnet: 0, discount: 1, luck: 0, orbitals: 0, vampire: 0, crit: 0, bombShot: 0,
    spikeResist: false, secretSense: false, breakBonus: 0, coinPower: false, glow: 0,
    fireCd: 0, inv: 0, activeCd: 0, items: [], kills: 0
  };
}

function gridArray(w, h, fill) { return Array.from({ length: h }, () => Array(w).fill(fill)); }
function inMap(x, y) { return G.level && x >= 0 && y >= 0 && x < G.level.w && y < G.level.h; }
function tileAt(tx, ty) { return !inMap(tx, ty) ? T.WALL : G.level.grid[ty][tx]; }
function doorClosed(tx, ty) {
  if (!G.level) return false;
  const door = G.level.doorMap[keyOf(tx, ty)];
  if (!door) return false;

  // Door safety: never close a combat door while the player is standing in or beside it.
  // This prevents the doorway trap where the player triggers the next room and gets pinned.
  if (G.player) {
    const cx = tx * TILE + TILE / 2;
    const cy = ty * TILE + TILE / 2;
    if (dist(G.player.x, G.player.y, cx, cy) < 58) return false;
  }

  for (const id of door.rooms) {
    const r = G.level.rooms[id];
    if (r && r.seen && !r.cleared && (r.type === 'combat' || r.type === 'boss')) return true;
  }
  return false;
}
function solidTile(tx, ty) {
  const t = tileAt(tx, ty);
  if (t === T.DOOR) return doorClosed(tx, ty);
  return t === T.WALL || t === T.BREAK;
}
function worldTile(x, y) { return [Math.floor(x / TILE), Math.floor(y / TILE)]; }
function roomAtWorld(x, y) {
  const [tx, ty] = worldTile(x, y);
  if (!inMap(tx, ty)) return -1;
  return G.level.roomId[ty][tx];
}
function floorWorld(cell) { return { x: cell[0] * TILE + TILE / 2, y: cell[1] * TILE + TILE / 2 }; }
function isFloorish(tx, ty) { const t = tileAt(tx, ty); return t === T.FLOOR || t === T.SPIKE || t === T.TRAPDOOR || t === T.SHOP || t === T.DOOR; }

function solidWorld(x, y, r = 8) {
  const pts = [[x-r,y],[x+r,y],[x,y-r],[x,y+r],[x-r*0.72,y-r*0.72],[x+r*0.72,y-r*0.72],[x-r*0.72,y+r*0.72],[x+r*0.72,y+r*0.72]];
  for (const p of pts) {
    const tx = Math.floor(p[0] / TILE), ty = Math.floor(p[1] / TILE);
    if (solidTile(tx, ty)) return true;
  }
  for (const prop of G.props) {
    if (!prop.solid || prop.hp <= 0) continue;
    if (circleRect(x, y, r, prop.x - prop.w/2, prop.y - prop.h/2, prop.w, prop.h)) return true;
  }
  return false;
}
function moveCircle(o, dx, dy, r = o.r || 9) {
  if (!solidWorld(o.x + dx, o.y, r)) o.x += dx;
  else { o.vx = (o.vx || 0) * -0.25; }
  if (!solidWorld(o.x, o.y + dy, r)) o.y += dy;
  else { o.vy = (o.vy || 0) * -0.25; }
}
function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  return Math.hypot(cx - nx, cy - ny) <= cr;
}

function generateLevel(floor, seedText) {
  rng = mulberry32(hashSeed(seedText + ':floor:' + floor));

  const nodes = [];
  const abstract = Object.create(null);
  const links = [];
  function absKey(x, y) { return x + ',' + y; }
  function addNode(gx, gy, type) {
    const id = nodes.length;
    const node = { id, gx, gy, type, links:[], doors:{}, seen:false, cleared:false, rewarded:false, cells:[], bounds:null, center:null, theme:null, rugs:[], secretBase:false };
    nodes.push(node);
    abstract[absKey(gx, gy)] = node;
    return node;
  }
  function getNode(gx, gy) { return abstract[absKey(gx, gy)]; }
  function dirBetween(a, b) {
    const dx = b.gx - a.gx, dy = b.gy - a.gy;
    if (dx === 1) return 'E'; if (dx === -1) return 'W'; if (dy === 1) return 'S'; return 'N';
  }
  function connect(a, b, secret = false) {
    if (!a || !b || a === b) return;
    if (links.some(l => (l.a === a.id && l.b === b.id) || (l.a === b.id && l.b === a.id))) return;
    const d = dirBetween(a, b);
    links.push({ a:a.id, b:b.id, dir:d, secret });
    a.links.push(b.id); b.links.push(a.id);
    a.doors[d] = { to:b.id, secret };
    b.doors[OPP[d]] = { to:a.id, secret };
  }
  function emptyAdjacent(base) {
    const ds = shuffle(Object.keys(DIRS));
    for (const d of ds) {
      const v = DIRS[d];
      const nx = base.gx + v[0], ny = base.gy + v[1];
      if (!getNode(nx, ny)) return [nx, ny];
    }
    return null;
  }
  function addAdjacent(base, type) {
    const pos = emptyAdjacent(base);
    if (!pos) return null;
    const n = addNode(pos[0], pos[1], type);
    connect(base, n, false);
    return n;
  }

  const start = addNode(0, 0, 'start');
  start.seen = true; start.cleared = true;
  let current = start;
  const mainLen = 5 + Math.min(3, floor);
  for (let i = 1; i <= mainLen; i++) {
    let next = null;
    for (let tries = 0; tries < 50 && !next; tries++) {
      const base = tries < 18 ? current : pick(nodes.filter(n => n.type !== 'boss' && n.type !== 'secret'));
      const type = i === mainLen ? 'boss' : 'combat';
      next = addAdjacent(base, type);
      if (next && base !== current && i !== mainLen && chance(0.35)) current = base;
    }
    if (next) current = next;
  }

  function addSpecial(type) {
    for (let tries = 0; tries < 70; tries++) {
      const base = pick(nodes.filter(n => !['boss','secret','treasure','merchant'].includes(n.type)));
      const n = addAdjacent(base, type);
      if (n) { n.cleared = true; return n; }
    }
    return null;
  }
  addSpecial('treasure');
  if (floor > 1 || chance(0.8)) addSpecial('treasure');
  addSpecial('merchant');
  for (let i = 0; i < 2 + floor; i++) {
    const base = pick(nodes.filter(n => n.type !== 'boss' && n.type !== 'secret'));
    let last = base;
    const len = ri(1, 2);
    for (let j = 0; j < len; j++) {
      const n = addAdjacent(last, 'combat');
      if (!n) break;
      last = n;
    }
  }

  let secret = null;
  for (let tries = 0; tries < 100 && !secret; tries++) {
    const base = pick(nodes.filter(n => !['boss','secret','merchant'].includes(n.type)));
    const pos = emptyAdjacent(base);
    if (!pos) continue;
    secret = addNode(pos[0], pos[1], 'secret');
    secret.cleared = true;
    secret.secretBase = base.id;
    connect(base, secret, true);
  }

  const minGX = Math.min(...nodes.map(n => n.gx));
  const maxGX = Math.max(...nodes.map(n => n.gx));
  const minGY = Math.min(...nodes.map(n => n.gy));
  const maxGY = Math.max(...nodes.map(n => n.gy));
  const w = (maxGX - minGX + 1) * ROOM_W + ROOM_MARGIN * 2;
  const h = (maxGY - minGY + 1) * ROOM_H + ROOM_MARGIN * 2;
  const grid = gridArray(w, h, T.WALL);
  const deco = gridArray(w, h, 0).map(row => row.map(() => ri(0, 7)));
  const roomId = gridArray(w, h, -1);
  const breakHp = Object.create(null);
  const secretTiles = Object.create(null);
  const doorMap = Object.create(null);
  const doors = [];

  function carveCell(x, y, id, tile = T.FLOOR) {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    grid[y][x] = tile;
    roomId[y][x] = id;
    const r = nodes[id];
    r.cells.push([x, y]);
  }
  function wallCell(x, y, id) {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    grid[y][x] = T.WALL;
    roomId[y][x] = id;
  }
  function breakCell(x, y, id, hp = 7, secretDoor = false, pair = null) {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    grid[y][x] = T.BREAK;
    roomId[y][x] = id;
    breakHp[keyOf(x, y)] = hp;
    if (secretDoor) secretTiles[keyOf(x, y)] = { pair };
  }

  function rectTiles(r, x, y, rw, rh, tile = null) {
    const x0 = clamp(Math.floor(x), r.bounds.x0 + 1, r.bounds.x1 - 1);
    const y0 = clamp(Math.floor(y), r.bounds.y0 + 1, r.bounds.y1 - 1);
    const x1 = clamp(Math.floor(x + rw), r.bounds.x0 + 1, r.bounds.x1);
    const y1 = clamp(Math.floor(y + rh), r.bounds.y0 + 1, r.bounds.y1);
    for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) carveCell(xx, yy, r.id, tile || (r.type === 'merchant' ? T.SHOP : T.FLOOR));
  }
  function addZone(r, type, x, y, rw, rh) {
    const z = {
      type,
      x: clamp(Math.floor(x), r.bounds.x0 + 1, r.bounds.x1 - 4),
      y: clamp(Math.floor(y), r.bounds.y0 + 1, r.bounds.y1 - 4),
      w: Math.max(4, Math.floor(rw)),
      h: Math.max(4, Math.floor(rh))
    };
    z.x = clamp(z.x, r.bounds.x0 + 1, r.bounds.x1 - z.w);
    z.y = clamp(z.y, r.bounds.y0 + 1, r.bounds.y1 - z.h);
    z.cx = z.x + z.w / 2;
    z.cy = z.y + z.h / 2;
    r.zones.push(z);
    rectTiles(r, z.x, z.y, z.w, z.h);
    return z;
  }
  function carveCorridorInRoom(r, a, b, width = 3, tile = null) {
    let x = Math.round(a.cx), y = Math.round(a.cy);
    const tx = Math.round(b.cx), ty = Math.round(b.cy);
    const firstHorizontal = chance(0.5);
    function stamp(cx, cy) {
      for (let yy = -Math.floor(width/2); yy <= Math.floor(width/2); yy++) {
        for (let xx = -Math.floor(width/2); xx <= Math.floor(width/2); xx++) {
          const px = cx + xx, py = cy + yy;
          if (px > r.bounds.x0 && px < r.bounds.x1 && py > r.bounds.y0 && py < r.bounds.y1) carveCell(px, py, r.id, tile || (r.type === 'merchant' ? T.SHOP : T.FLOOR));
        }
      }
    }
    const walkX = () => { while (x !== tx) { x += Math.sign(tx - x); stamp(x, y); if (chance(0.08) && y !== ty) { y += Math.sign(ty - y); stamp(x, y); } } };
    const walkY = () => { while (y !== ty) { y += Math.sign(ty - y); stamp(x, y); if (chance(0.08) && x !== tx) { x += Math.sign(tx - x); stamp(x, y); } } };
    stamp(x, y);
    if (firstHorizontal) { walkX(); walkY(); } else { walkY(); walkX(); }
  }
  function planRoom(r) {
    const b = r.bounds;
    r.zones = [];

    const mainW = r.type === 'boss' ? 16 : r.type === 'merchant' ? 14 : ri(10, 14);
    const mainH = r.type === 'boss' ? 10 : r.type === 'merchant' ? 8 : ri(7, 10);
    const main = addZone(r, r.type === 'boss' ? 'arena' : 'main', Math.floor(r.center.x - mainW/2), Math.floor(r.center.y - mainH/2), mainW, mainH);

    const entryByDir = {};
    for (const d of Object.keys(r.doors)) {
      let z;
      if (d === 'N') z = addZone(r, 'entry', Math.floor(r.center.x - 4), b.y0 + 1, 8, 5);
      if (d === 'S') z = addZone(r, 'entry', Math.floor(r.center.x - 4), b.y1 - 5, 8, 4);
      if (d === 'W') z = addZone(r, 'entry', b.x0 + 1, Math.floor(r.center.y - 3), 6, 6);
      if (d === 'E') z = addZone(r, 'entry', b.x1 - 6, Math.floor(r.center.y - 3), 5, 6);
      if (z) { entryByDir[d] = z; carveCorridorInRoom(r, z, main, 3); }
    }

    const sideCount = r.type === 'boss' ? 4 : r.type === 'start' ? 3 : r.type === 'merchant' ? 5 : r.type === 'treasure' || r.type === 'secret' ? 2 : ri(3, 5);
    const anchors = shuffle([
      [b.x0 + 2, b.y0 + 2],
      [b.x1 - 10, b.y0 + 2],
      [b.x0 + 2, b.y1 - 7],
      [b.x1 - 10, b.y1 - 7],
      [Math.floor(r.center.x - 5), b.y0 + 2],
      [Math.floor(r.center.x - 5), b.y1 - 7],
      [b.x0 + 2, Math.floor(r.center.y - 3)],
      [b.x1 - 10, Math.floor(r.center.y - 3)]
    ]);
    for (let i = 0; i < sideCount; i++) {
      const a = anchors[i % anchors.length];
      const zw = ri(6, r.type === 'boss' ? 9 : 11);
      const zh = ri(4, 7);
      const z = addZone(r, i === 0 && r.type === 'combat' && chance(0.45) ? 'trap_nook' : 'side', a[0] + ri(-1, 2), a[1] + ri(-1, 2), zw, zh);
      carveCorridorInRoom(r, main, z, chance(0.25) ? 2 : 3);
    }

    if ((r.type === 'combat' || r.type === 'treasure') && chance(0.45)) {
      const z = addZone(r, 'hidden_alcove', b.x1 - 8, b.y0 + 2, 6, 5);
      for (let x = z.x - 1; x <= z.x + z.w; x++) {
        if (x > b.x0 && x < b.x1 && z.y + z.h < b.y1) breakCell(x, z.y + z.h, r.id, 5 + floor, false);
      }
    }

    r.center = { x: main.cx, y: main.cy };
    r.entryByDir = entryByDir;
  }

  for (const r of nodes) {
    const x0 = ROOM_MARGIN + (r.gx - minGX) * ROOM_W;
    const y0 = ROOM_MARGIN + (r.gy - minGY) * ROOM_H;
    const x1 = x0 + ROOM_W - 1;
    const y1 = y0 + ROOM_H - 1;
    r.bounds = { x0, y0, x1, y1 };
    r.center = { x:(x0+x1)/2, y:(y0+y1)/2 };
    r.theme = r.type === 'merchant' ? 'shop' : r.type === 'treasure' ? 'reliquary' : r.type === 'boss' ? 'ballroom' : pick(['library','dining','gallery','storage','study','armory']);
    r.rugs = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) wallCell(x, y, r.id);
    planRoom(r);
    for (const z of r.zones) {
      if (['main','arena','side'].includes(z.type) && chance(0.45)) r.rugs.push({ x:z.x+1, y:z.y+1, w:Math.max(2,z.w-2), h:Math.max(2,z.h-2), color:pick(['#8b2139','#27405e','#5d3b76','#744322']) });
    }
  }

  function makeDoor(a, b, dir, secret = false) {
    const ra = nodes[a], rb = nodes[b];
    const ba = ra.bounds, bb = rb.bounds;
    const tiles = [];
    function addDoorTile(x, y, id) {
      grid[y][x] = T.DOOR;
      roomId[y][x] = id;
      tiles.push([x, y]);
    }
    function addSecretTile(x, y, id, pairX, pairY) {
      breakCell(x, y, id, 9, true, [pairX, pairY]);
      tiles.push([x, y]);
    }
    if (dir === 'E' || dir === 'W') {
      const ya = Math.floor((ba.y0 + ba.y1) / 2);
      const xa = dir === 'E' ? ba.x1 : ba.x0;
      const xb = dir === 'E' ? bb.x0 : bb.x1;
      for (let off = -1; off <= 1; off++) {
        if (secret) { addSecretTile(xa, ya+off, a, xb, ya+off); addSecretTile(xb, ya+off, b, xa, ya+off); }
        else { addDoorTile(xa, ya+off, a); addDoorTile(xb, ya+off, b); }
      }
    } else {
      const xa = Math.floor((ba.x0 + ba.x1) / 2);
      const ya = dir === 'S' ? ba.y1 : ba.y0;
      const yb = dir === 'S' ? bb.y0 : bb.y1;
      for (let off = -1; off <= 1; off++) {
        if (secret) { addSecretTile(xa+off, ya, a, xa+off, yb); addSecretTile(xa+off, yb, b, xa+off, ya); }
        else { addDoorTile(xa+off, ya, a); addDoorTile(xa+off, yb, b); }
      }
    }
    if (!secret) {
      const door = { rooms:[a,b], dir, tiles };
      doors.push(door);
      for (const [x, y] of tiles) doorMap[keyOf(x, y)] = door;
    }
  }
  for (const l of links) makeDoor(l.a, l.b, l.dir, l.secret);

  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    if (grid[y][x] !== T.WALL) continue;
    const id = roomId[y][x];
    if (id < 0 || nodes[id].type === 'secret') continue;
    const nearFloor = [grid[y][x+1],grid[y][x-1],grid[y+1][x],grid[y-1][x]].some(t => t === T.FLOOR || t === T.SHOP);
    if (nearFloor && chance(0.004 + floor * 0.001)) breakCell(x, y, id, 5 + floor, false);
  }

  return { w, h, grid, deco, roomId, breakHp, secretTiles, doorMap, doors, rooms:nodes, links, start, boss:nodes.find(r => r.type === 'boss'), minGX, minGY };
}

function startRun() {
  G.state = 'playing';
  G.floor = 1;
  G.seedText = 'manor-' + Date.now().toString(36) + '-' + Math.floor(Math.random()*9999);
  G.player = makePlayer(0, 0);
  buildFloor(true);
  say('Rooms now fill the screen. Doors lock during fights. Clear rooms for a 75% upgrade chance.', 4600);
}
function buildFloor(newRun = false) {
  G.level = generateLevel(G.floor, G.seedText);
  G.bullets = []; G.ebullets = []; G.enemies = []; G.props = []; G.items = []; G.drops = []; G.particles = []; G.hazards = []; G.traps = [];
  G.merchant = null; G.currentRoom = G.level.start.id;
  const p0 = floorWorld([Math.round(G.level.start.center.x), Math.round(G.level.start.center.y)]);
  G.player.x = p0.x; G.player.y = p0.y; G.player.inv = 1600;
  populateLevel();
  snapCameraToRoom(G.level.start.id, true);
  if (!newRun) say('Floor ' + G.floor + ': the manor rebuilds its room plan.', 2400);
}

function populateLevel() {
  for (const room of G.level.rooms) {
    if (room.type === 'start') { decorateRoom(room, 10, false); continue; }
    if (room.type === 'merchant') { makeMerchant(room); decorateRoom(room, 17, true); continue; }
    if (room.type === 'treasure') { decorateRoom(room, 8, false); placeItem(room.center.x*TILE, room.center.y*TILE, false, 0, false, room.id); continue; }
    if (room.type === 'secret') { decorateRoom(room, 6, false); placeItem(room.center.x*TILE, room.center.y*TILE, false, 0, true, room.id); continue; }
    if (room.type === 'boss') {
      decorateRoom(room, 10, false);
      addRoomHazards(room, 8 + G.floor * 2);
      const c = floorWorld([Math.round(room.center.x), Math.round(room.center.y)]);
      spawnEnemy('boss', c.x, c.y, room.id);
      continue;
    }
    decorateRoom(room, ri(10, 18), false);
    addRoomHazards(room, ri(1, 3 + G.floor));
    const n = ri(4, 6 + G.floor);
    for (let i = 0; i < n; i++) {
      const cell = randomCell(room, 4);
      if (!cell) continue;
      const p = floorWorld(cell);
      spawnEnemy(pick(['skitter','spitter','slug','moth','turret']), p.x, p.y, room.id);
    }
  }
}

function randomCell(room, margin = 2) {
  const zones = (room.zones || []).filter(z => !['entry','hidden_alcove'].includes(z.type));
  for (let i = 0; i < 120; i++) {
    let x, y;
    if (zones.length && chance(0.82)) {
      const z = pick(zones);
      x = ri(Math.floor(z.x + margin), Math.floor(z.x + z.w - margin - 1));
      y = ri(Math.floor(z.y + margin), Math.floor(z.y + z.h - margin - 1));
    } else {
      x = ri(room.bounds.x0 + margin, room.bounds.x1 - margin);
      y = ri(room.bounds.y0 + margin, room.bounds.y1 - margin);
    }
    if (!isFloorish(x, y) || tileAt(x, y) === T.DOOR) continue;
    const p = floorWorld([x, y]);
    if (dist(p.x, p.y, room.center.x*TILE, room.center.y*TILE) < 72 && room.type === 'combat') continue;
    if (solidWorld(p.x, p.y, 13)) continue;
    return [x, y];
  }
  return [Math.round(room.center.x), Math.round(room.center.y)];
}
function decorateRoom(room, count, shopLike) {
  const byTheme = {
    library:['bookshelf','bookshelf','chair','table','cabinet'],
    dining:['longtable','chair','chair','barrel','cabinet'],
    gallery:['statue','table','chair','cabinet','crate'],
    storage:['crate','crate','barrel','cabinet','bookshelf'],
    study:['desk','chair','bookshelf','cabinet','table'],
    armory:['crate','statue','cabinet','barrel','table'],
    shop:['bookshelf','counter','chair','cabinet','crate'],
    reliquary:['statue','cabinet','table','bookshelf'],
    ballroom:['statue','chair','table','cabinet']
  };
  const types = shopLike ? byTheme.shop : (byTheme[room.theme] || byTheme.study);
  for (let i = 0; i < count; i++) {
    const cell = randomCell(room, 2); if (!cell) continue;
    const p = floorWorld(cell);
    if (dist(p.x, p.y, room.center.x*TILE, room.center.y*TILE) < 96) continue;
    G.props.push(makeProp(p.x + ri(-5,5), p.y + ri(-5,5), pick(types), room.id));
  }
}
function makeProp(x, y, type, roomId) {
  const sizes = {
    table:[42,26,7], longtable:[86,28,13], chair:[24,24,4], bookshelf:[30,58,10], crate:[30,30,5],
    barrel:[28,34,6], cabinet:[34,46,8], desk:[54,30,9], counter:[70,28,12], statue:[30,30,12]
  };
  const s = sizes[type] || [28,28,5];
  const solid = chance(0.82);
  return { x, y, w:s[0], h:s[1], hp:s[2], maxHp:s[2], type, roomId, solid };
}
function addRoomHazards(room, count) {
  for (let i = 0; i < count; i++) {
    const cell = randomCell(room, 3); if (!cell) continue;
    if (chance(0.62)) {
      G.level.grid[cell[1]][cell[0]] = T.SPIKE;
    } else {
      const p = floorWorld(cell);
      G.traps.push({ x:p.x, y:p.y, dir:pick([[1,0],[-1,0],[0,1],[0,-1]]), cd:ri(700,2400), roomId:room.id, awake:false });
    }
  }
}
function makeMerchant(room) {
  const c = floorWorld([Math.round(room.center.x), Math.round(room.center.y)]);
  G.merchant = { x:c.x, y:c.y-44, roomId:room.id, talk:0 };
  for (let i = -1; i <= 1; i++) {
    placeItem(c.x + i * 86, c.y + 48, true, Math.max(3, Math.floor((6 + G.floor*2 + ri(0,5)) * G.player.discount)), false, room.id);
  }
}
function placeItem(x, y, shop = false, price = 0, hidden = false, roomId = -1) {
  const item = pick(ITEMS);
  G.items.push({ x, y, r:17, item, shop, price, hidden, seen:!hidden, bob:rnd()*TAU, sold:false, roomId });
}
function spawnEnemy(type, x, y, roomId) {
  const hpBase = 7 + G.floor * 2.5;
  const e = { type, x, y, vx:0, vy:0, r:13, hp:hpBase, maxHp:hpBase, damage:1, speed:80, roomId, awake:false, cd:ri(500,1800), poison:0, splitDone:false, boss:false, phase:0 };
  if (type === 'skitter') { e.speed = 105 + G.floor*6; e.hp = hpBase * 0.9; e.r = 12; }
  if (type === 'spitter') { e.speed = 58; e.hp = hpBase * 1.05; e.r = 13; }
  if (type === 'slug') { e.speed = 45; e.hp = hpBase * 1.3; e.r = 15; }
  if (type === 'moth') { e.speed = 92; e.hp = hpBase * 0.82; e.r = 11; e.phase = rnd()*TAU; }
  if (type === 'turret') { e.speed = 0; e.hp = hpBase * 0.85; e.r = 14; }
  if (type === 'boss') { e.boss = true; e.r = 32; e.hp = 88 + G.floor*40; e.maxHp = e.hp; e.speed = 74 + G.floor*4; e.damage = 1; }
  e.hp = e.maxHp = Math.round(e.hp);
  G.enemies.push(e);
}

function say(text, ms = 1800) { G.message = text; G.messageT = ms; }
function floatText(x, y, text, color = '#fff4c8') { G.texts.push({ x, y, text, color, life: 900, vy:-24 }); }
function burst(x, y, color, n = 10, power = 160) {
  for (let i = 0; i < n; i++) {
    const a = rnd()*TAU, s = rnd()*power;
    G.particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:ri(240,720), color, r:ri(2,5) });

function pickupItem(it) {
  if (it.sold) return;
  if (it.shop) {
    if (G.player.coins < it.price) { say('The merchant taps the price tag. Need ' + it.price + ' coins.', 1300); return; }
    G.player.coins -= it.price;
  }
  it.sold = true;
  it.item.apply(G.player);
  G.player.items.push(it.item.name);
  floatText(it.x, it.y - 34, it.item.name, '#ffe78b');
  say(it.item.name + ': ' + it.item.desc, 3300);
  burst(it.x, it.y, '#ffe78b', 28, 210);
  applySynergyMessages();
}
function applySynergyMessages() {
  const p = G.player;
  if (p.split && p.poison && !p._toxicFork) { p._toxicFork=true; say('Synergy: toxic forked shots seed poison puddles everywhere.', 2600); }
  if (p.shots >= 3 && p.lightning && !p._storm) { p._storm=true; say('Synergy: wide volleys turn Static Jam into a room-wide storm.', 2600); }
  if (p.bounce && p.homing && !p._smartBounce) { p._smartBounce=true; say('Synergy: homing rebounds hunt enemies around corners.', 2600); }
  if (p.coinPower && p.discount < 0.8 && !p._greed) { p._greed=true; say('Synergy: cheap shops feed Cardboard Crown damage.', 2600); }
}

function spawnDrop(x, y, kind, amount = 1) {
  G.drops.push({ x, y, kind, amount, r: kind === 'coin' ? 8 : 10, vx:ri(-60,60), vy:ri(-60,60), life: 22000 });
}
function damagePlayer(n, x, y) {
  const p = G.player;
  if (p.inv > 0 || G.state !== 'playing') return;
  p.hp -= n;
  p.inv = 900;
  G.shake = 16;
  burst(p.x, p.y, '#ff4e6d', 22, 220);
  floatText(p.x, p.y-26, '-' + n, '#ff8a9f');
  const ang = Math.atan2(p.y - y, p.x - x);
  moveCircle(p, Math.cos(ang)*26, Math.sin(ang)*26, p.r);
  if (p.hp <= 0) { G.state = 'dead'; say('The manor swallows you. Press R to start a new run.', 999999); }
}

function spawnBullet(owner, x, y, ang, opts = {}) {
  const speed = opts.speed || (owner === 'player' ? G.player.shotSpeed : 260);
  const b = {
    owner, x, y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed, r: opts.r || (owner === 'player' ? 5 : 6),
    damage: opts.damage || 1, life: opts.life || 1300, pierce: opts.pierce || 0, bounce: opts.bounce || 0,
    poison: !!opts.poison, lightning: !!opts.lightning, split: !!opts.split, homing: !!opts.homing, splitDepth: opts.splitDepth || 0,
    bomb: opts.bomb || 0, color: opts.color || (owner === 'player' ? '#f7e7b0' : '#ff7392')
  };
  (owner === 'player' ? G.bullets : G.ebullets).push(b);
}
function firePlayer() {
  const p = G.player;
  let ax = 0, ay = 0;
  if (keys.arrowleft) ax -= 1; if (keys.arrowright) ax += 1; if (keys.arrowup) ay -= 1; if (keys.arrowdown) ay += 1;
  if (ax === 0 && ay === 0 && mouse.down) {
    const wx = mouse.x + G.cam.x, wy = mouse.y + G.cam.y;
    ax = wx - p.x; ay = wy - p.y;
  }
  if (ax === 0 && ay === 0) return;
  if (G.now < p.fireCd) return;
  p.fireCd = G.now + p.fireRate;
  const base = Math.atan2(ay, ax);
  const shots = Math.max(1, p.shots);
  const coinBonus = p.coinPower ? Math.floor(p.coins / 10) * 0.35 : 0;
  for (let i = 0; i < shots; i++) {
    const off = (i - (shots - 1) / 2) * p.spread + (rnd()-0.5)*0.025;
    const crit = chance(p.crit + p.luck * 0.08);
    spawnBullet('player', p.x + Math.cos(base)*18, p.y + Math.sin(base)*18, base + off, {
      damage: (p.damage + coinBonus) * (crit ? 2.1 : 1), life: p.range / p.shotSpeed * 1000,
      pierce:p.pierce, bounce:p.bounce, poison:p.poison, lightning:p.lightning, split:p.split, homing:p.homing,
      bomb:p.bombShot, color:crit ? '#fff06b' : '#f7e7b0'
    });
  }
  burst(p.x + Math.cos(base)*18, p.y + Math.sin(base)*18, '#fff4c8', 3, 50);
}

function update(dt) {
  if (G.state === 'title') return;
  G.now += dt;
  const p = G.player;
  if (G.state !== 'playing') { updateParticles(dt); return; }

  let mx = 0, my = 0;
  if (keys.a) mx -= 1; if (keys.d) mx += 1; if (keys.w) my -= 1; if (keys.s) my += 1;
  const ml = Math.hypot(mx, my) || 1;
  mx /= ml; my /= ml;
  const sp = p.speed * (keys.shift ? 0.7 : 1);
  moveCircle(p, mx * sp * dt/1000, my * sp * dt/1000, p.r);
  if (p.inv > 0) p.inv -= dt;
  if (p.activeCd > 0) p.activeCd -= dt;

  if (keys[' '] && p.activeCd <= 0) {
    p.activeCd = 2400;
    burst(p.x, p.y, '#9fe9ff', 40, 280);
    for (const e of G.enemies) if (e.awake && dist(p.x,p.y,e.x,e.y) < 150) damageEnemy(e, 4 + p.damage, p.x, p.y);
    say('Pocket shockwave!', 800);
  }

  firePlayer();
  updateRoomState();
  updateBullets(dt);
  updateEnemies(dt);
  updateDrops(dt);
  updateProps(dt);
  updateHazards(dt);
  updateParticles(dt);
  updateItems(dt);
  updateTraps(dt);
  updateInteractions();

  const [tx, ty] = worldTile(p.x, p.y);
  const tile = tileAt(tx, ty);
  if (tile === T.SPIKE && p.inv <= 0) damagePlayer(p.spikeResist ? 0.5 : 1, p.x, p.y);
  if (tile === T.TRAPDOOR && justInteract) {
    if (G.floor >= 4) { G.state = 'win'; say('You escaped Clockwork Manor. Press R for a new run.', 999999); }
    else { G.floor++; buildFloor(false); }
  }
  if (G.messageT > 0) G.messageT -= dt;
  justInteract = false;

  const room = G.level.rooms[G.currentRoom];
  const targetX = room ? room.center.x * TILE - innerWidth / 2 : p.x - innerWidth / 2;
  const targetY = room ? room.center.y * TILE - innerHeight / 2 : p.y - innerHeight / 2;
  G.cam.x = lerp(G.cam.x, targetX, 0.14);
  G.cam.y = lerp(G.cam.y, targetY, 0.14);
  G.shake = Math.max(0, G.shake - dt * 0.04);
}

function snapCameraToRoom(id, instant = false) {
  const room = G.level.rooms[id];
  if (!room) return;
  const tx = room.center.x * TILE - innerWidth / 2;
  const ty = room.center.y * TILE - innerHeight / 2;
  if (instant) { G.cam.x = tx; G.cam.y = ty; }
}
function updateRoomState() {
  const rid = roomAtWorld(G.player.x, G.player.y);
  if (rid >= 0 && G.level.rooms[rid]) {
    const room = G.level.rooms[rid];
    if (G.currentRoom !== rid) {
      G.currentRoom = rid;
      snapCameraToRoom(rid, false);
    }
    if (!room.seen) {
      room.seen = true;
      if (room.type === 'combat') say('Doors lock. Clear the room for a reward.', 1300);
      if (room.type === 'boss') say('Guardian of Floor ' + G.floor, 1500);
      if (room.type === 'secret') say('Secret room discovered.', 1700);
      if (room.type === 'merchant') say('Merchant: E near an item to buy. Prices respect discounts.', 1900);
    }
    for (const e of G.enemies) if (e.roomId === rid) e.awake = true;
    for (const tr of G.traps) if (tr.roomId === rid) tr.awake = true;
    for (const it of G.items) if (it.hidden && it.roomId === rid) it.seen = true;
  }
  for (const room of G.level.rooms) {
    if (!room.seen || room.cleared || !['combat','boss'].includes(room.type)) continue;
    const alive = G.enemies.some(e => e.roomId === room.id && e.hp > 0);
    if (!alive) {
      room.cleared = true;
      G.shake = Math.max(G.shake, 5);
      if (room.type === 'boss') {
        const c = floorWorld([Math.round(room.center.x), Math.round(room.center.y)]);
        const [tx, ty] = worldTile(c.x, c.y);
        G.level.grid[ty][tx] = T.TRAPDOOR;
        say('The guardian falls. Trapdoor open: stand on it and press E.', 2600);
        burst(c.x, c.y, '#9b5cff', 54, 280);
        for (let i = 0; i < 10 + G.floor; i++) spawnDrop(c.x + ri(-44,44), c.y + ri(-32,32), 'coin');
        placeItem(c.x + 66, c.y, false, 0, false, room.id);
      } else if (!room.rewarded) {
        room.rewarded = true;
        const c = floorWorld([Math.round(room.center.x), Math.round(room.center.y)]);
        const upgradeChance = clamp(0.75 + G.player.luck * 0.35, 0.75, 0.94);
        if (chance(upgradeChance)) {
          placeItem(c.x, c.y, false, 0, false, room.id);
          for (let i = 0; i < ri(1, 3); i++) spawnDrop(c.x+ri(-44,44), c.y+ri(-34,34), 'coin');
          say('Room clear: upgrade reward!', 1300);
        } else {
          for (let i = 0; i < ri(5, 9); i++) spawnDrop(c.x+ri(-52,52), c.y+ri(-40,40), chance(0.78) ? 'coin' : 'heart');
          say('Room clear: supplies dropped.', 1100);
        }
        burst(c.x, c.y, '#ffe78b', 28, 200);
      }
    }
  }
}

function updateBullets(dt) {
  function updateList(list, playerOwned) {
    for (let i = list.length - 1; i >= 0; i--) {
      const b = list[i];
      b.life -= dt;
      if (b.homing && playerOwned) {
        const e = nearestEnemy(b.x, b.y, 260);
        if (e) {
          const want = Math.atan2(e.y - b.y, e.x - b.x);
          const have = Math.atan2(b.vy, b.vx);
          const turn = clamp(normAng(want - have), -0.055, 0.055);
          const sp = Math.hypot(b.vx,b.vy);
          b.vx = Math.cos(have + turn) * sp; b.vy = Math.sin(have + turn) * sp;
        }
      }
      const nx = b.x + b.vx * dt/1000, ny = b.y + b.vy * dt/1000;
      const [tx, ty] = worldTile(nx, ny);
      if (solidTile(tx, ty)) {
        if (tileAt(tx, ty) === T.BREAK && playerOwned) damageTile(tx, ty, b.damage + G.player.breakBonus);
        if (b.bounce > 0) {
          const sx = solidWorld(nx, b.y, b.r), sy = solidWorld(b.x, ny, b.r);
          if (sx) b.vx *= -1;
          if (sy) b.vy *= -1;
          b.bounce--; b.x += b.vx * 0.012; b.y += b.vy * 0.012; b.life *= 0.92;
        } else {
          bulletDeath(b, playerOwned); list.splice(i,1);
        }
        continue;
      }
      b.x = nx; b.y = ny;
      if (playerOwned) {
        let hit = false;
        for (const prop of G.props) {
          if (prop.hp <= 0) continue;
          if (circleRect(b.x,b.y,b.r,prop.x-prop.w/2,prop.y-prop.h/2,prop.w,prop.h)) {
            damageProp(prop, b.damage); hit = true; break;
          }
        }
        if (hit) { bulletDeath(b, true); list.splice(i,1); continue; }
        for (const e of G.enemies) {
          if (e.hp <= 0 || !e.awake) continue;
          if (dist(b.x,b.y,e.x,e.y) < b.r + e.r) {
            damageEnemy(e, b.damage, b.x, b.y, b);
            if (b.pierce > 0) b.pierce--; else { bulletDeath(b, true); list.splice(i,1); }
            break;
          }
        }
      } else if (dist(b.x,b.y,G.player.x,G.player.y) < b.r + G.player.r) {
        damagePlayer(1, b.x, b.y); list.splice(i,1); continue;
      }
      if (b.life <= 0) { bulletDeath(b, playerOwned); list.splice(i,1); }
    }
  }
  updateList(G.bullets, true);
  updateList(G.ebullets, false);
}
function bulletDeath(b, playerOwned) {
  if (!playerOwned) { burst(b.x,b.y,'#ff7392',4,50); return; }
  burst(b.x,b.y,b.color,3,45);
  if (b.poison) G.hazards.push({ x:b.x, y:b.y, r:34, life:1600, tick:0, damage:0.42, color:'#71f060' });
  if (b.split && b.splitDepth < 1) {

function drawEnemies() {
  for (const e of G.enemies) {
    if (e.hp <= 0) continue;
    ctx.save(); ctx.translate(e.x,e.y);
    if (!e.awake) ctx.globalAlpha = 0.45;
    if (e.type === 'skitter') { ctx.fillStyle='#d4144a'; polygon(0,0,e.r,6,G.now/500); }
    else if (e.type === 'spitter') { ctx.fillStyle='#d4144a'; ctx.beginPath(); ctx.arc(0,0,e.r,0,TAU); ctx.fill(); ctx.fillStyle='#5d2030'; ctx.fillRect(-9,-3,18,6); }
    else if (e.type === 'slug') { ctx.fillStyle='#b0163f'; ctx.beginPath(); ctx.ellipse(0,0,e.r+5,e.r,0,0,TAU); ctx.fill(); }
    else if (e.type === 'moth') { ctx.fillStyle='#e01850'; ctx.beginPath(); ctx.ellipse(-7,0,12,7,0.5,0,TAU); ctx.ellipse(7,0,12,7,-0.5,0,TAU); ctx.fill(); }
    else if (e.type === 'turret') { ctx.fillStyle='#871230'; polygon(0,0,e.r,8,0); ctx.fillStyle='#ff7392'; ctx.fillRect(-4,-18,8,18); }
    else if (e.type === 'boss') { ctx.fillStyle='#6d1743'; polygon(0,0,e.r,9,G.now/900); ctx.fillStyle='#ff9fbb'; ctx.beginPath(); ctx.arc(-10,-6,5,0,TAU); ctx.arc(10,-6,5,0,TAU); ctx.fill(); }
    if (e.poison > 0) { ctx.strokeStyle='#71f060'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,e.r+4,0,TAU); ctx.stroke(); }
    if (e.boss) { ctx.fillStyle='#1a0f21'; ctx.fillRect(-40,-48,80,7); ctx.fillStyle='#ff6f91'; ctx.fillRect(-40,-48,80*(e.hp/e.maxHp),7); }
    ctx.restore();
  }
}
function polygon(x,y,r,n,rot=0) {
  ctx.beginPath();
  for(let i=0;i<n;i++){const a=rot+i/n*TAU; const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
  ctx.closePath(); ctx.fill();
}
function drawBullets() {
  for (const b of G.bullets.concat(G.ebullets)) {
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fillStyle=b.color; ctx.fill();
    if (b.lightning) { ctx.strokeStyle='#9fe9ff'; ctx.lineWidth=1; ctx.stroke(); }
  }
}
function drawPlayer() {
  const p = G.player;
  ctx.save(); ctx.translate(p.x,p.y);
  if (p.inv > 0 && Math.floor(G.now/80)%2===0) ctx.globalAlpha = 0.45;
  ctx.fillStyle='#f4e9d8'; ctx.beginPath(); ctx.arc(0,0,p.r,0,TAU); ctx.fill();
  ctx.fillStyle='#211722'; ctx.beginPath(); ctx.arc(-4,-3,2,0,TAU); ctx.arc(5,-3,2,0,TAU); ctx.fill();
  ctx.strokeStyle='#d6c1af'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,p.r+4,0,TAU); ctx.stroke();
  ctx.restore();
  if (p.orbitals) {
    for (let i=0;i<p.orbitals;i++) {
      const a=G.now/430+i*TAU/p.orbitals, ox=p.x+Math.cos(a)*48, oy=p.y+Math.sin(a)*48;
      ctx.save(); ctx.translate(ox,oy); ctx.rotate(a*3); ctx.fillStyle='#c9d0d9'; polygon(0,0,12,8,0); ctx.restore();
    }
  }
}
function drawParticlesWorld() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life/500,0,1);
    if (p.line) { ctx.strokeStyle=p.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x2,p.y2); ctx.stroke(); }
    else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r||3,0,TAU); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  for (const t of G.texts) {
    ctx.globalAlpha = clamp(t.life/450,0,1);
    ctx.fillStyle=t.color; ctx.font='bold 15px monospace'; ctx.textAlign='center'; ctx.fillText(t.text,t.x,t.y);
    ctx.globalAlpha=1;
  }
}
function drawLighting(W,H) {
  const p = G.player;
  const gx = p.x - G.cam.x, gy = p.y - G.cam.y;
  const grad = ctx.createRadialGradient(gx,gy,130+p.glow,gx,gy,620+p.glow);
  grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
}
function drawUI(W,H) {
  const p = G.player;
  ctx.fillStyle='rgba(11,8,14,0.72)'; ctx.fillRect(14,14,400,104);
  ctx.fillStyle='#f4e9d8'; ctx.font='bold 17px monospace'; ctx.textAlign='left';
  ctx.fillText('Clockwork Manor - Floor ' + G.floor + '/4', 26, 38);
  for (let i=0;i<p.maxHp;i++) {
    ctx.fillStyle = i < Math.ceil(p.hp) ? '#ff658d' : '#3f2632';
    ctx.beginPath(); ctx.arc(32+i*18,62,7,0,TAU); ctx.fill();
    if (p.hp % 1 === 0.5 && i === Math.floor(p.hp)) { ctx.fillStyle='#3f2632'; ctx.fillRect(32+i*18,55,8,14); }
  }
  ctx.fillStyle='#ffd461'; ctx.fillText('coins ' + p.coins, 26, 91);
  ctx.fillStyle='#b9f7ff'; ctx.fillText('items ' + p.items.length + '   kills ' + p.kills, 128, 91);
  ctx.fillStyle='#f4e9d8'; ctx.font='12px monospace';
  ctx.fillText('WASD move | arrows/mouse shoot | E buy/exit/talk | Space shockwave | R restart after run', 26, 111);

  drawMiniMap(W,H);

  if (G.messageT > 0 && G.message) {
    const lines = wrapText(G.message, 84);
    ctx.fillStyle='rgba(11,8,14,0.78)'; ctx.fillRect(W/2-410,H-92,820,58 + lines.length*2);
    ctx.fillStyle='#fff0c8'; ctx.font='bold 15px monospace'; ctx.textAlign='center';
    lines.forEach((l,i)=>ctx.fillText(l,W/2,H-60+i*19));
  }
  if (G.state === 'dead' || G.state === 'win') drawEndOverlay(W,H);
}
function drawMiniMap(W,H) {
  const rooms = G.level.rooms;
  const scale = 18, ox = W - 185, oy = 52;
  ctx.fillStyle='rgba(11,8,14,0.68)'; ctx.fillRect(ox-62,oy-44,164,138);
  for (const l of G.level.links) {
    if (l.secret) continue;
    const a=rooms[l.a], b=rooms[l.b]; if (!a.seen || !b.seen) continue;
    ctx.strokeStyle='rgba(230,220,200,0.38)'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(ox+a.gx*scale,oy+a.gy*scale); ctx.lineTo(ox+b.gx*scale,oy+b.gy*scale); ctx.stroke();
  }
  for (const r of rooms) {
    if (r.type === 'secret' && !r.seen && !G.player.secretSense) continue;
    if (!r.seen && r.type !== 'secret') continue;
    const x=ox+r.gx*scale, y=oy+r.gy*scale;
    ctx.fillStyle = r.type==='boss'?'#9b5cff':r.type==='merchant'?'#ffd461':r.type==='treasure'?'#ffe78b':r.type==='secret'?'#ddea66':r.id===G.currentRoom?'#0bf0bd':'#75677e';
    if (!r.seen) ctx.globalAlpha=0.35;
    ctx.fillRect(x-6,y-5,12,10); ctx.globalAlpha=1;
    if (r.id === G.currentRoom) { ctx.strokeStyle='#ffffff'; ctx.strokeRect(x-8,y-7,16,14); }
  }
}
function drawEndOverlay(W,H) {
  ctx.fillStyle='rgba(0,0,0,0.68)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=G.state==='win'?'#ffe78b':'#ff8ca8'; ctx.font='bold 44px monospace'; ctx.textAlign='center';
  ctx.fillText(G.state==='win'?'ESCAPED THE MANOR':'RUN ENDED', W/2, H/2-36);
  ctx.fillStyle='#f4e9d8'; ctx.font='18px monospace';
  ctx.fillText('Items: ' + G.player.items.join(', '), W/2, H/2+4);
  ctx.fillText('Press R for a new procedurally generated run', W/2, H/2+38);
}
function drawTitle(W,H) {
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#0c0910'); g.addColorStop(1,'#211417'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffe78b'; ctx.font='bold 54px monospace'; ctx.fillText('CLOCKWORK MANOR', W/2, H/2-104);
  ctx.fillStyle='#f4e9d8'; ctx.font='18px monospace';
  ctx.fillText('A single-file HTML5 room-based top-down roguelite prototype', W/2, H/2-64);
  ctx.fillStyle='#b9f7ff'; ctx.font='16px monospace';
  ctx.fillText('Screen-sized handcrafted-feeling rooms, teal doors, yellow secrets, breakable furniture, traps, merchants, bosses, and item synergies.', W/2, H/2-26);
  ctx.fillStyle='#f4e9d8'; ctx.fillText('WASD move · Arrow keys or mouse shoot · E interact/buy/exit · Space shockwave', W/2, H/2+18);
  ctx.fillStyle='#ffe78b'; ctx.font='bold 22px monospace'; ctx.fillText('Click or press Enter to enter the manor', W/2, H/2+72);
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.font='13px monospace';
  ctx.fillText('Original theme and item names; genre-inspired, not a copy of any existing game assets or story.', W/2, H-48);
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(33, t - last); last = t;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
